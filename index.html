<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Інтерактивна карта земельних ділянок</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.awesome-markers@2.0.4/dist/leaflet.awesome-markers.css">

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    #map { height: 100%; width: 100%; }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GBY1G4B8K8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GBY1G4B8K8');
  </script>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet.awesome-markers@2.0.4/dist/leaflet.awesome-markers.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var map = L.map('map').setView([50.4501, 30.5234], 8);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        language: 'uk'
      }).addTo(map);

      var markers = L.markerClusterGroup({ maxClusterRadius: 25 });

      function createCustomIcon(type, color) {
        return L.AwesomeMarkers.icon({
          prefix: 'fa',
          icon: type === 'house' ? 'home' : 'map-marker',
          markerColor: color
        });
      }

      var plots = [

        // ====== АКТИВНІ / ПРОДАНІ ======
        // visible: false = продана або прихована (зберігається для статистики)
        // visible: true  = активна, показується на карті
        { type: 'plot', color: 'blue', coords: [50.318169, 30.002693],
          name: "Осикове", price: "25 000 $", size: "0.5 га", distance: "49.6 км",
          link: "https://landhub.com.ua/plot/dilianka-50-sotok-v-seli-osykove", visible: true },

      ];

      plots.forEach(plot => {
        if (!plot.hasOwnProperty("visible") || plot.visible) {
          let marker = L.marker(plot.coords, {
            icon: createCustomIcon(plot.type, plot.color)
          });

          marker.bindPopup(
            '<b>' + plot.name + '</b><br>' +
            'Ціна: ' + plot.price + '<br>' +
            'Площа: ' + plot.size + '<br>' +
            'Відстань до Києва: ' + plot.distance + '<br>' +
            '<a href="' + plot.link + '" target="_blank" rel="noopener noreferrer">Докладніше</a>'
          );

          marker.on('click', function() {
            if (typeof gtag === 'function') {
              gtag('event', 'select_plot', { 'plot_id': plot.name });
            }
          });

          markers.addLayer(marker);
        }
      });

      map.addLayer(markers);

      const KYIV = L.latLng(50.4501, 30.5234);

      function fitAllIncludingKyiv() {
        let b = markers.getBounds ? markers.getBounds() : L.latLngBounds();
        let all = L.latLngBounds(b);
        all.extend(KYIV);
        if (all.isValid()) {
          map.fitBounds(all, { padding: [40, 40], maxZoom: 11, animate: false });
        } else {
          map.setView(KYIV, 10);
        }
      }

      setTimeout(fitAllIncludingKyiv, 0);
      map.on('resize', fitAllIncludingKyiv);
    });
  </script>
</body>
</html>
